[project]
name = "nrgrd"
version = "0.1.0"
description = "NeuroGrid TUI: terminal client for chatting with OpenAI-compatible inference endpoints, managing sessions, and running MCP servers from your terminal"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asciimatics>=1.15.0",
    "keyring>=25.0.0",
    "openai>=2.50.0",
    "platformdirs>=4.11.0",
    "pydantic>=2.13.4",
    "prompt-toolkit>=3.0.52",
    "rich>=15.0.0",
    "textual>=8.2.8",
]

[project.scripts]
nrgrd = "nrgrd.app:main"
nrgrd-mcp = "nrgrd.workspace.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
