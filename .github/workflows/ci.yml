name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The oldest supported Python and the newest, on every platform.
        python: ["3.11", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest tests/ -q
        env:
          # No OS keyring exists on CI runners; the credential store must
          # fall back to its file backend rather than hanging on a prompt.
          PYTHON_KEYRING_BACKEND: keyring.backends.fail.Keyring

      - name: Check the CLI starts
        run: uv run nrgrd --version

  package:
    # Catches packaging breakage on the pull request, not at release time.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build

      - name: Validate package metadata
        run: uvx twine check --strict dist/*
